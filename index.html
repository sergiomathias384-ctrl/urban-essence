<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Essence</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#111;
    color:white;
}

header{
    background:black;
    text-align:center;
    padding:25px;
}

header h1{
    color:gold;
    margin:0;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

h2{
    text-align:center;
}

.productos{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:25px;
}

.card{
    background:#1c1c1c;
    width:260px;
    border-radius:12px;
    padding:15px;
    text-align:center;
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:10px;
}

.precio{
    font-size:22px;
    font-weight:bold;
    color:gold;
}

.btn{
    display:block;
    background:gold;
    color:black;
    text-decoration:none;
    padding:12px;
    border-radius:8px;
    font-weight:bold;
    margin-top:10px;
}

.btn:hover{
    background:#ffd700;
}

.whatsapp{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#25D366;
    color:white;
    text-decoration:none;
    font-size:28px;
    padding:15px;
    border-radius:50%;
}

footer{
    background:black;
    text-align:center;
    padding:20px;
    margin-top:40px;
}
</style>
</head>

<body>

<header>
    <h1>🔥 Urban Essence</h1>
    <p>Estilo, elegancia y actitud</p>
</header>

<div class="container">

    <h2>🛍️ Nuestros Productos</h2>

    <div class="productos">

        <div class="card">
            <img src="imagen.png" alt="Billetera Valencia">
            <h3>Billetera Valencia Marrón</h3>
            <p class="precio">S/ 125.00</p>
            <a class="btn" href="https://wa.me/51986788414?text=Hola,%20quiero%20comprar%20la%20Billetera%20Valencia">
                Comprar
            </a>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/300x250?text=Colonia+Fresh" alt="Colonia Fresh">
            <h3>Colonia Fresh</h3>
            <p class="precio">S/ 59.90</p>
            <a class="btn" href="https://wa.me/51986788414?text=Hola,%20quiero%20comprar%20la%20Colonia%20Fresh">
                Comprar
            </a>
        </div>

    </div>

</div>

<a class="whatsapp" href="https://wa.me/51986788414">💬</a>

<footer>
    © 2026 Urban Essence - Todos los derechos reservados
</footer>

</body>
</html>
