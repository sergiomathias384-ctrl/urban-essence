<!DOCTYPE html>
<html>
<head>
    <title>Urban Essence</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #111;
            color: white;
        }

        header {
            background: black;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: gold;
            margin: 0;
        }

        .container {
            padding: 20px;
            text-align: center;
        }

        .productos {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .card {
            background: #1c1c1c;
            border-radius: 12px;
            width: 220px;
            padding: 15px;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            border-radius: 10px;
        }

        .btn {
            background: gold;
            color: black;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        .whatsapp {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #25D366;
            color: white;
            padding: 15px;
            border-radius: 50%;
            font-size: 20px;
            text-decoration: none;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            background: black;
            text-align: center;
            font-size: 14px;
            color: gray;
        }
    </style>
</head>

<body>

<header>
    <h1>🔥 Urban Essence</h1>
    <p>Estilo, elegancia y actitud</p>
</header>

<div class="container">
    <h2>🛍️ Nuestros Productos</h2>

    <div class="productos">

        <div class="card">
            <img src="./imagen.png" alt="">
            <h3>Billetera Premium</h3>
            <p>S/ 49.90</p>
            <a class="btn" href="https://wa.me/519XXXXXXXX?text=Hola%20quiero%20la%20billetera">Comprar</a>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/300" alt="">
            <h3>Colonia Fresh</h3>
            <p>S/ 59.90</p>
            <a class="btn" href="https://wa.me/519XXXXXXXX?text=Hola%20quiero%20la%20colonia">Comprar</a>
        </div>

    </div>
</div>

<a class="whatsapp" href="https://wa.me/986788414">💬</a>

<footer>
    © 2026 Esencia Urbana - Todos los derechos reservados
</footer>

</body>
</html>
